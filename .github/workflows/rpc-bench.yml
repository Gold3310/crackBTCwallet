name: RPC provider benchmark (Alchemy mainnet only)

# Runs where egress exists (GitHub-hosted runners), because the Arena sandbox
# cannot reach provider endpoints at all. The endpoint URL - which contains the
# API key - comes from a repository secret and is never committed.
#
# Access policy: this workflow refuses anything that is not Ethereum mainnet on
# Alchemy (rpc-harness/policy.py). The policy step fails the job before any
# traffic is sent.
#
# Two ways to run:
#   1. manually   - Actions tab -> Run workflow, or `gh workflow run rpc-bench.yml`
#   2. on a timer - set repository variable RPC_BENCH_SCHEDULE=on, then every 6h
#                   (the variable is opt-in so a missing secret cannot produce
#                    failing runs nobody asked for)

on:
  workflow_dispatch:
    inputs:
      contract_address:
        description: "Ethereum mainnet contract address to benchmark (0x...)"
        required: false
        default: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
      block_from:
        description: "First block for getLogs"
        required: false
        default: "20000000"
      block_to:
        description: "Last block for getLogs"
        required: false
        default: "20001000"
      requests:
        description: "Requests per method"
        required: false
        default: "30"
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: rpc-bench
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Scheduled runs only happen once the operator opts in.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.RPC_BENCH_SCHEDULE == 'on'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Access policy self-test (no network needed)
        run: python3 rpc-harness/policy.py --self-test

      - name: Require and validate the endpoint
        env:
          ALCHEMY_URL: ${{ secrets.ALCHEMY_URL }}
        run: |
          if [ -z "${ALCHEMY_URL:-}" ]; then
            echo "::error::ALCHEMY_URL secret is not set. Add it under Settings -> Secrets and variables -> Actions, then re-run."
            exit 1
          fi
          python3 rpc-harness/policy.py --check "$ALCHEMY_URL"

      - name: Harness self-test
        run: python3 rpc-harness/bench.py --selftest

      - name: Build contract config (mainnet, chain id 1)
        env:
          ADDRESS: ${{ inputs.contract_address || '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48' }}
          FROM: ${{ inputs.block_from || '20000000' }}
          TO: ${{ inputs.block_to || '20001000' }}
        run: |
          python3 - <<'PY'
          import json, os
          cfg = json.load(open("rpc-harness/contracts.example.json"))
          cfg["chain_id"] = 1
          cfg["address"] = os.environ["ADDRESS"]
          cfg["block_range"] = [int(os.environ["FROM"]), int(os.environ["TO"])]
          json.dump(cfg, open("contracts.ci.json", "w"), indent=2)
          print("chain_id", cfg["chain_id"], "address", cfg["address"], "range", cfg["block_range"])
          PY

      - name: Run benchmark
        env:
          ALCHEMY_URL: ${{ secrets.ALCHEMY_URL }}
          REQUESTS: ${{ inputs.requests || '30' }}
        run: ./run-bench.sh contracts.ci.json runs/ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpc-benchmark-results
          path: runs/ci/
          if-no-files-found: warn

      - name: Publish summary
        if: always() && hashFiles('runs/ci/summary.md') != ''
        run: cat runs/ci/summary.md >> "$GITHUB_STEP_SUMMARY"
